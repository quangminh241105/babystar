services:
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-babystar}:${POSTGRES_PASSWORD:-babystar}@babystar-db:5432/${POSTGRES_DB:-babystar}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://babystar.qminh.com,https://babystar.mom}
      SESSION_SECURE: ${SESSION_SECURE:-true}
      SESSION_SAMESITE: ${SESSION_SAMESITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_WEEKLY_ADVICE: ${GEMINI_API_KEY_WEEKLY_ADVICE:-}
      GEMINI_API_KEY_NUTRITION_SUGGESTIONS: ${GEMINI_API_KEY_NUTRITION_SUGGESTIONS:-}
      GEMINI_API_KEY_EXERCISE_SUGGESTIONS: ${GEMINI_API_KEY_EXERCISE_SUGGESTIONS:-}
      GEMINI_API_KEY_QUIZ: ${GEMINI_API_KEY_QUIZ:-}
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    networks:
      - babystar_shared
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-babystar}:${POSTGRES_PASSWORD:-babystar}@babystar-db:5432/${POSTGRES_DB:-babystar}
    networks:
      - babystar_shared
    command: python -m app.worker
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  babystar_shared:
    external: true
    name: babystar_shared
