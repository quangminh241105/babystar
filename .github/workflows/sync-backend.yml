
name: Sync backend from main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch all
        run: git fetch origin

      - name: Try fast-forward backend to main
        run: |
          # Make sure backend exists
          if ! git show-ref --verify --quiet refs/heads/backend; then
            git branch backend origin/backend || git branch backend
          fi

          git checkout backend
          set +e
          git merge --ff-only origin/main
          FF=$?
          set -e

          if [ $FF -eq 0 ]; then
            git push origin backend
            echo "Fast-forwarded backend to main."
          else
            echo "Fast-forward failed; creating PR."
            echo "::set-output name=need_pr::true"
          fi

      - name: Create PR (if needed)
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync backend with main"
          title: "Sync backend <- main"
          body: |
            Automated sync: main → backend
            Fast-forward failed; this PR merges changes.
          base: backend
          branch: sync/main-to-backend
          delete-branch: true
