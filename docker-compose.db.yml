services:
  db:
    image: postgres:16-alpine
    container_name: babystar-db-shared
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-babystar}
      POSTGRES_USER: ${POSTGRES_USER:-babystar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-babystar}
    volumes:
      - babystar_postgres:/var/lib/postgresql/data
    networks:
      babystar_shared:
        aliases:
          - babystar-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  babystar_shared:
    external: true
    name: babystar_shared

volumes:
  babystar_postgres:
    external: true
    name: babystar_babystar_postgres
